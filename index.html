<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.webp" type="image/webp">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Todo-List</title>
</head>

<body>
    <div class="container">
        <h1 class="title">Мой Список Задач</h1>

        <button class="lightAndDark" data-lightAndDarkBtn>🌙</button>

        <div class="container_input">
            <input type="text" class="input" placeholder="Добавить новую задачу..." data-input>
            <button class="btn" data-btn>Добавить</button>
        </div>

        <label for="deadLine-id" class="label-todo">Выбрать дату дедлайна</label>

        <div class="container_deadLine-input">
            <input type="date" class="date-input" id="deadLine-id" placeholder="Выберите дату дедлайна" data-date-input>

            <select class="deadLine_input--select" data-select>
                <option value="" class="input_select--option" disabled selected>Выбрать приоритет</option>
                <option value="Низкий 🟢" class="input_select--option">Низкий</option>
                <option value="Средний 🟠" class="input_select--option">Средний</option>
                <option value="Высокий 🔴" class="input_select--option">Высокий</option>
            </select>
        </div>

        <input type="text" class="search-input" data-search-input placeholder="Найти задачу...">

        <div class="todo_wrapper" data-todo-wrapper>
            <nav class="todo_wrapper--navigation">
                <ul class="navigation_list">
                    <li class="navigation_list--item">
                        <button class="navigation_list--link active" type="button" data-filter="all">Все <span
                                data-count-all>0</span></button>
                    </li>
                    <li class="navigation_list--item">
                        <button class="navigation_list--link" type="button" data-filter="active">Активные <span
                                data-count-active>0</span></button>
                    </li>
                    <li class="navigation_list--item">
                        <button class="navigation_list--link" type="button" data-filter="completed">Выполненные <span
                                data-count-completed>0</span></button>
                    </li>
                </ul>
            </nav>
        </div>

        <div class="container_wrapper-content">
            <button class="remove-completed" data-remove-completed>Удалить Выполненное</button><button
                class="select-all" data-select-all>Отметить все</button>
        </div>

        <div class="container-todos" data-list-todos></div>
    </div>

    <template data-todo-template>
        <div class="todo" data-id="">
            <input type="checkbox" class="todo-checkbox" data-todo-checkbox>

            <div class="todo-info">
                <p class="todo-text" data-todo-text>text</p>
                <div class="todo_info--dates">
                    <span class="todo-date" data-todo-date>29.04.2026</span>
                    <span class="todo-difficulties" data-todo-difficulties></span>
                </div>
            </div>

            <span class="todo-deadLine-date" data-todo-deadLine-date></span>

            <button class="remove-btn" data-remove-btn>🗑️</button>
        </div>
    </template>
</body>

</html>
