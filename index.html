<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.webp" type="image/webp">
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
    <title>Todo-List</title>
</head>

<body>
    <div class="container">
        <h1 class="title">Мой Список Задач</h1>
        <div class="container_input">
            <input type="text" class="input" placeholder="Добавить новую задачу..." data-input>
            <button class="btn" data-btn>Добавить</button>
        </div>
        <div class="todo_wrapper" data-todo-wrapper>
            <nav class="todo_wrapper--navigation">
                <ul class="navigation_list">
                    <li class="navigation_list--item">
                        <button class="navigation_list--link active" type="button" data-filter="all">Все <span data-count-all>0</span></button>
                    </li>
                    <li class="navigation_list--item">
                        <button class="navigation_list--link" type="button" data-filter="active">Активные <span data-count-active>0</span></button>
                    </li>
                    <li class="navigation_list--item">
                        <button class="navigation_list--link" type="button" data-filter="completed">Выполненные <span data-count-completed>0</span></button>
                    </li>
                </ul>
            </nav>
        </div>
        <div class="container-todos" data-list-todos></div>
    </div>

    <template data-todo-template>
        <div class="todo">
            <input type="checkbox" class="todo-checkbox" data-todo-checkbox>
            <p class="todo-text" data-todo-text>text</p>
            <button class="remove-btn" data-remove-btn>🗑️</button>
        </div> 
    </template>
</body>

</html>
